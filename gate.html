<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCP Wireframe Review — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #f0f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1e2a3a;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.06);
      width: 100%;
      max-width: 400px;
      padding: 36px 32px 32px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      background: #032D60;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { display: block; }
    .logo-text { line-height: 1.25; }
    .logo-name { font-size: 15px; font-weight: 700; color: #032D60; letter-spacing: -.01em; }
    .logo-sub  { font-size: 11px; color: #4a5f7f; }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      color: #032D60;
      letter-spacing: -.02em;
    }
    .tagline {
      margin: 0 0 28px;
      font-size: 13px;
      color: #4a5f7f;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #1e2a3a;
      margin-bottom: 5px;
    }
    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #b0bdd0;
      border-radius: 5px;
      color: #1e2a3a;
      background: #fff;
      transition: border-color .12s, box-shadow .12s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #0176D3;
      box-shadow: 0 0 0 3px rgba(1,118,211,.15);
    }
    .field { margin-bottom: 18px; }
    .field-hint {
      font-size: 11px;
      color: #6b7c96;
      margin-top: 4px;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 5px;
      color: #7f1d1d;
      font-size: 13px;
      padding: 9px 12px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      padding: 10px;
      background: #0176D3;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background .12s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { background: #0259a3; }
    button[type="submit"]:focus-visible {
      outline: 2px solid #0176D3;
      outline-offset: 2px;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #8a9ab5;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo-mark" aria-hidden="true">
        <!-- Equinix-style E glyph -->
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="4" width="9" height="2.5" rx="1" fill="#fff"/>
          <rect x="3" y="8.75" width="7" height="2.5" rx="1" fill="#fff"/>
          <rect x="3" y="13.5" width="9" height="2.5" rx="1" fill="#fff"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="logo-name">Equinix</div>
        <div class="logo-sub">Partner Connect Portal</div>
      </div>
    </div>

    <h1>Wireframe Review</h1>
    <p class="tagline">Sign in with your Equinix email to access the design preview.</p>

    <div class="error" id="err-msg" role="alert"></div>

    <form id="gate-form" onsubmit="handleSignIn(event)" novalidate>
      <div class="field">
        <label for="g-email">Work email</label>
        <input
          type="email"
          id="g-email"
          autocomplete="email"
          placeholder="you@equinix.com"
          required
        >
        <div class="field-hint">Must be an @equinix.com or @eu.equinix.com address</div>
      </div>
      <div class="field">
        <label for="g-pass">Access code</label>
        <input
          type="password"
          id="g-pass"
          autocomplete="current-password"
          placeholder="Enter access code"
          required
        >
      </div>

      <button type="submit">Sign In →</button>
    </form>

    <p class="footer-note">
      This is an internal design preview.<br>
      Questions? Email <a href="mailto:rybooth@equinix.com">rybooth@equinix.com</a>
    </p>
  </div>

  <script>
    var PASS = 'eqP@rtners';
    var AUTH_KEY = 'pcp-wf-auth';

    // If already authenticated, skip the gate
    if (localStorage.getItem(AUTH_KEY) === '1') {
      window.location.replace('index.html');
    }

    function handleSignIn(e) {
      e.preventDefault();
      var email = document.getElementById('g-email').value.trim().toLowerCase();
      var pass  = document.getElementById('g-pass').value;
      var err   = document.getElementById('err-msg');

      err.classList.remove('visible');

      if (!email.endsWith('@equinix.com') && !email.endsWith('@eu.equinix.com')) {
        showError('Access is limited to @equinix.com or @eu.equinix.com email addresses.');
        return;
      }
      if (pass !== PASS) {
        showError('Incorrect access code. Check with rybooth@equinix.com.');
        return;
      }

      localStorage.setItem(AUTH_KEY, '1');
      localStorage.setItem('pcp-wf-reviewer-email', email);
      window.location.replace('index.html');
    }

    function showError(msg) {
      var err = document.getElementById('err-msg');
      err.textContent = msg;
      err.classList.add('visible');
      err.focus();
    }
  </script>
</body>
</html>
